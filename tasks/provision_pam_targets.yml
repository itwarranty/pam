---
# Provision pam_targets inventory (credential broking, known_hosts, manifest).
- name: Каталог targets на хосте
  ansible.builtin.file:
    path: "{{ pam_targets_home }}"
    state: directory
    owner: "{{ pam_user }}"
    group: "{{ pam_user }}"
    mode: "0750"
    setype: container_file_t
  when: pam_targets | default([]) | length > 0

- name: Каталог runtime sessions (gateway registry)
  ansible.builtin.file:
    path: "{{ pam_runtime_dir }}/sessions"
    state: directory
    owner: "{{ pam_user }}"
    group: "{{ pam_user }}"
    mode: "{{ pam_runtime_sessions_dir_mode | default('0750') }}"
    setype: container_file_t
  when: pam_targets | default([]) | length > 0

- name: Provisioning target {{ item.id }}
  ansible.builtin.file:
    path: "{{ pam_targets_home }}/{{ item.id }}"
    state: directory
    owner: "{{ pam_user }}"
    group: "{{ pam_user }}"
    mode: "0700"
    setype: container_file_t
  loop: "{{ pam_targets | default([]) }}"
  loop_control:
    label: "{{ item.id }}"

- name: Fetch target keys from HashiCorp Vault (Tier 4, opt-in)
  ansible.builtin.include_tasks: tasks/fetch_vault_target_keys.yml
  when: pam_vault_enabled | default(false) | bool

- name: Target identity key {{ item.id }}
  ansible.builtin.copy:
    src: "{{ item.identity_file }}"
    dest: "{{ pam_targets_home }}/{{ item.id }}/identity"
    owner: "{{ pam_user }}"
    group: "{{ pam_user }}"
    mode: "0600"
    setype: container_file_t
  loop: "{{ pam_targets | default([]) }}"
  loop_control:
    label: "{{ item.id }}"
  no_log: true
  when:
    - item.identity_file | default('') | length > 0
    - item.vault_secret_path | default('') | length == 0

- name: Target env {{ item.id }}
  ansible.builtin.template:
    src: pam_target_env.j2
    dest: "{{ pam_targets_home }}/{{ item.id }}/target.env"
    owner: "{{ pam_user }}"
    group: "{{ pam_user }}"
    mode: "0640"
    setype: container_file_t
  vars:
    target: "{{ item }}"
  loop: "{{ pam_targets | default([]) }}"
  loop_control:
    label: "{{ item.id }}"

- name: Targets manifest (JSON)
  ansible.builtin.template:
    src: pam_targets_manifest.json.j2
    dest: "{{ pam_targets_home }}/manifest.json"
    owner: "{{ pam_user }}"
    group: "{{ pam_user }}"
    mode: "0640"
    setype: container_file_t
  when: pam_targets | default([]) | length > 0
  notify: Restart ssh pam container

- name: SSH known_hosts for targets
  ansible.builtin.template:
    src: ssh_known_hosts_targets.j2
    dest: "{{ pam_targets_home }}/known_hosts"
    owner: "{{ pam_user }}"
    group: "{{ pam_user }}"
    mode: "0644"
    setype: container_file_t
  when: pam_targets | default([]) | length > 0
  notify: Restart ssh pam container

- name: SELinux container_file_t для targets
  ansible.builtin.command:
    argv:
      - chcon
      - -R
      - -t
      - container_file_t
      - "{{ pam_targets_home }}"
  changed_when: true
  when:
    - pam_targets | default([]) | length > 0
    - ansible_selinux.status | default('disabled') == 'enabled'
