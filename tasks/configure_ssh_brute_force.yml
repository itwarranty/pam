---
# SSH brute-force / rate protection on pam_ssh_port (host firewalld or fail2ban).
- name: SSH rate limit — firewalld rich rule (global)
  ansible.posix.firewalld:
    rich_rule: >-
      rule family="ipv4" source address="0.0.0.0/0" port port="{{ pam_ssh_port }}"
      protocol="tcp" limit value="{{ pam_ssh_rate_limit_rate }}" accept
    permanent: true
    state: enabled
    immediate: true
  when:
    - pam_ssh_rate_limit_enabled | bool
    - pam_ssh_rate_limit_method | default('firewalld') == 'firewalld'
    - pam_allowed_source_cidrs | default([]) | length == 0

- name: SSH rate limit — firewalld per-CIDR (with source restriction)
  ansible.posix.firewalld:
    rich_rule: >-
      rule family="ipv4" source address="{{ item }}" port port="{{ pam_ssh_port }}"
      protocol="tcp" limit value="{{ pam_ssh_rate_limit_rate }}" accept
    permanent: true
    state: enabled
    immediate: true
  loop: "{{ pam_allowed_source_cidrs }}"
  loop_control:
    label: "{{ item }}"
  when:
    - pam_ssh_rate_limit_enabled | bool
    - pam_ssh_rate_limit_method | default('firewalld') == 'firewalld'
    - pam_allowed_source_cidrs | default([]) | length > 0

- name: Установка fail2ban (опционально)
  ansible.builtin.package:
    name: fail2ban
    state: present
  when:
    - pam_ssh_rate_limit_enabled | bool
    - pam_ssh_rate_limit_method == 'fail2ban'

- name: Fail2ban jail SSH PAM SSH
  ansible.builtin.template:
    src: fail2ban-pam.conf.j2
    dest: /etc/fail2ban/jail.d/gateway.conf
    owner: root
    group: root
    mode: "0644"
  when:
    - pam_ssh_rate_limit_enabled | bool
    - pam_ssh_rate_limit_method == 'fail2ban'
  notify: Restart fail2ban

- name: Fail2ban filter SSH PAM SSH
  ansible.builtin.template:
    src: fail2ban-pam-filter.conf.j2
    dest: /etc/fail2ban/filter.d/gateway-ssh.conf
    owner: root
    group: root
    mode: "0644"
  when:
    - pam_ssh_rate_limit_enabled | bool
    - pam_ssh_rate_limit_method == 'fail2ban'
  notify: Restart fail2ban
