---
# Удаление операторов, отсутствующих в effective списке (declarative sync + JIT expiry).
- name: Декларированный список имён операторов
  ansible.builtin.set_fact:
    pam_operator_names: >-
      {{
        (pam_operators_effective | default(pam_operators))
        | map(attribute='name')
        | list
      }}

- name: Каталоги операторов на хосте
  ansible.builtin.find:
    paths: "{{ operators_home }}"
    file_type: directory
    depth: 1
  register: pam_operator_dirs_on_host

- name: Отозванные операторы (есть на диске, нет в pam_operators)
  ansible.builtin.set_fact:
    pam_revoked_operator_names: >-
      {{
        pam_operator_dirs_on_host.files
        | map(attribute='path')
        | map('basename')
        | difference(pam_operator_names)
        | list
      }}

- name: Kill active gateway sessions for revoked operators
  ansible.builtin.include_tasks: tasks/kill_gateway_sessions.yml
  vars:
    pam_kill_operators: "{{ pam_revoked_operator_names }}"
  when:
    - pam_revoked_operator_names | length > 0
    - not (is_commercial_pam | bool)

- name: Удаление каталогов отозванных операторов
  ansible.builtin.file:
    path: "{{ operators_home }}/{{ item }}"
    state: absent
  loop: "{{ pam_revoked_operator_names }}"
  loop_control:
    label: "{{ item }}"
  notify: Restart ssh pam container

- name: Удаление MFA onboarding для отозванных операторов
  ansible.builtin.file:
    path: "{{ pam_mfa_secrets_output_dir }}/{{ inventory_hostname }}/{{ item }}.mfa.txt"
    state: absent
  loop: "{{ pam_revoked_operator_names }}"
  loop_control:
    label: "{{ item }}"
  delegate_to: localhost
  become: false
  when: pam_revoked_operator_names | length > 0

- name: Удаление отозванных операторов внутри контейнера ssh_pam
  ansible.builtin.shell: |
    set -e
    podman exec {{ pam_container_name }} id "{{ item }}" >/dev/null 2>&1 && \
      podman exec {{ pam_container_name }} deluser -r "{{ item }}" || true
    podman exec {{ pam_container_name }} rm -rf "/home/{{ item }}" || true
  loop: "{{ pam_revoked_operator_names }}"
  loop_control:
    label: "{{ item }}"
  become: true
  become_user: "{{ pam_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[pam_user][1] }}"
  when:
    - pam_revoked_operator_names | length > 0
    - not (is_commercial_pam | bool)
  changed_when: true
  notify: Restart ssh pam container

- name: Синхронизация Unix-учёток контейнера с декларативным списком
  ansible.builtin.shell: |
    set -e
    allowed=" {{ pam_operator_names | join(' ') }} "
    for home in $(podman exec {{ pam_container_name }} sh -c 'ls -1 /home 2>/dev/null || true'); do
      case "${allowed}" in
        *" ${home} "*) continue ;;
      esac
      podman exec {{ pam_container_name }} deluser -r "${home}" 2>/dev/null || true
      podman exec {{ pam_container_name }} rm -rf "/home/${home}" || true
      echo "removed:${home}"
    done
  become: true
  become_user: "{{ pam_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[pam_user][1] }}"
  when: not (is_commercial_pam | bool)
  register: pam_container_user_sync
  changed_when: pam_container_user_sync.stdout is search('removed:')
  notify: Restart ssh pam container
