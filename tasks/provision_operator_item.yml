---
- name: "Подготовка каталогов {{ operator.name }}"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ pam_user }}"
    group: "{{ pam_user }}"
    mode: "{{ '0700' if item.endswith('.ssh') else '0750' }}"
    setype: container_file_t
  loop:
    - "{{ operators_home }}/{{ operator.name }}"
    - "{{ operators_home }}/{{ operator.name }}/.ssh"

- name: "authorized_keys для {{ operator.name }}"
  ansible.builtin.template:
    src: authorized_keys.j2
    dest: "{{ operators_home }}/{{ operator.name }}/.ssh/authorized_keys"
    owner: "{{ pam_user }}"
    group: "{{ pam_user }}"
    mode: "0600"
    setype: container_file_t
  notify: Restart ssh pam container

- name: "Чтение существующего MFA-секрета {{ operator.name }}"
  ansible.builtin.slurp:
    src: "{{ operators_home }}/{{ operator.name }}/.google_authenticator"
  register: operator_mfa_existing_file
  failed_when: false
  when: not (operator.dr_service | default(false) | bool)

- name: "Парсинг существующего MFA-секрета {{ operator.name }}"
  ansible.builtin.set_fact:
    operator_mfa_existing_secret: "{{ (operator_mfa_existing_file.content | b64decode).split('\n') | first | trim }}"
  when:
    - not (operator.dr_service | default(false) | bool)
    - operator_mfa_existing_file.content is defined
    - (operator_mfa_existing_file.content | b64decode).split('\n') | first | trim | length > 0

- name: "Генерация MFA-секрета для {{ operator.name }} (bootstrap/rotate only)"
  ansible.builtin.command: openssl rand -base32 20
  register: operator_mfa_generated
  changed_when: false
  no_log: true
  when:
    - operator.mfa_secret | default('') | length == 0
    - not (operator.dr_service | default(false) | bool)
    - >-
      operator.name in (pam_mfa_rotate_operators | default([]))
      or (
        (pam_mfa_bootstrap_generate | default(false) | bool)
        and (operator_mfa_existing_secret | default('') | length == 0)
      )

- name: "Проверка источника MFA-секрета {{ operator.name }}"
  ansible.builtin.fail:
    msg: >
      Нет MFA-секрета для {{ operator.name }}: задайте operator.mfa_secret,
      включите pam_mfa_bootstrap_generate (только lab) или сохраните существующий секрет.
  when:
    - not (operator.dr_service | default(false) | bool)
    - operator.mfa_secret | default('') | length == 0
    - operator_mfa_existing_secret | default('') | length == 0
    - operator_mfa_generated.stdout | default('') | length == 0
    - operator.name not in (pam_mfa_rotate_operators | default([]))

- name: "Регистрация MFA-секрета {{ operator.name }}"
  ansible.builtin.set_fact:
    operator_mfa_secrets: "{{ operator_mfa_secrets | default({}) | combine({operator.name: operator_mfa_effective_secret}) }}"
  vars:
    operator_mfa_effective_secret: >-
      {{
        operator_mfa_generated.stdout
        if (
          operator.name in (pam_mfa_rotate_operators | default([]))
          and (operator_mfa_generated.stdout | default('') | length > 0)
        )
        else (
          operator.mfa_secret
          if (operator.mfa_secret | default('') | length > 0)
          else (
            operator_mfa_generated.stdout
            if (
              (pam_mfa_bootstrap_generate | default(false) | bool)
              and (operator_mfa_generated.stdout | default('') | length > 0)
            )
            else operator_mfa_existing_secret | default('')
          )
        )
      }}
  when: not (operator.dr_service | default(false) | bool)

- name: "TOTP-конфигурация для {{ operator.name }}"
  ansible.builtin.template:
    src: google_authenticator.j2
    dest: "{{ operators_home }}/{{ operator.name }}/.google_authenticator"
    owner: "{{ pam_user }}"
    group: "{{ pam_user }}"
    mode: "0600"
    setype: container_file_t
  vars:
    mfa_secret: "{{ operator_mfa_secrets[operator.name] }}"
  no_log: true
  notify: Restart ssh pam container
  when: not (operator.dr_service | default(false) | bool)

- name: "DR service state dir {{ operator.name }}"
  ansible.builtin.file:
    path: "{{ operators_home }}/{{ operator.name }}/.dr"
    state: directory
    owner: "{{ pam_user }}"
    group: "{{ pam_user }}"
    mode: "0700"
    setype: container_file_t
  when: operator.dr_service | default(false) | bool

- name: "DR service automation key {{ operator.name }}"
  ansible.builtin.copy:
    src: "{{ operator.automation_key_file }}"
    dest: "{{ operators_home }}/{{ operator.name }}/.dr/automation_key"
    owner: "{{ pam_user }}"
    group: "{{ pam_user }}"
    mode: "0600"
    setype: container_file_t
  no_log: true
  when:
    - operator.dr_service | default(false) | bool
    - operator.automation_key_file | default('') | length > 0
  notify: Restart ssh pam container

- name: "Break-glass marker {{ operator.name }}"
  ansible.builtin.copy:
    dest: "{{ operators_home }}/{{ operator.name }}/.pam-break-glass"
    owner: "{{ pam_user }}"
    group: "{{ pam_user }}"
    mode: "0600"
    setype: container_file_t
    content: |
      break_glass=true
      incident_id={{ operator.incident_id }}
      valid_until={{ operator.valid_until | default('') }}
  when: operator.break_glass | default(false) | bool
  notify: Restart ssh pam container

- name: "permit_open для gateway/jump {{ operator.name }}"
  ansible.builtin.copy:
    dest: "{{ operators_home }}/{{ operator.name }}/permit_open"
    owner: "{{ pam_user }}"
    group: "{{ pam_user }}"
    mode: "0640"
    setype: container_file_t
    # Always pass non-empty content — ansible.copy rejects an empty template body
    # (e.g. DR service operators with permit_open: []).
    content: "{{ (operator.permit_open | default([]) | join('\n') ~ '\n') if (operator.permit_open | default([])) else '\n' }}"
  when: operator.access | default('jump') in ['gateway', 'jump']
  notify: Restart ssh pam container

- name: "SELinux: container_file_t для дерева {{ operator.name }} (Podman :Z mount)"
  ansible.builtin.command:
    argv:
      - chcon
      - -R
      - -t
      - container_file_t
      - "{{ operators_home }}/{{ operator.name }}"
  register: operator_selinux_fix
  changed_when: false
  when: ansible_selinux.status | default('disabled') == 'enabled'
