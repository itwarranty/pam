---
- name: JIT — фильтр окон доступа (valid_from / valid_until)
  ansible.builtin.include_tasks: tasks/jit_filter_operators.yml

- name: Отзыв операторов вне декларативного списка (CSO sync + JIT)
  ansible.builtin.include_tasks: tasks/purge_revoked_operators.yml

- name: Создание корневой директории операторов
  ansible.builtin.file:
    path: "{{ operators_home }}"
    state: directory
    owner: "{{ pam_user }}"
    group: "{{ pam_user }}"
    mode: "0750"
    setype: container_file_t

- name: Provisioning домашних каталогов и ключей операторов
  ansible.builtin.include_tasks: tasks/provision_operator_item.yml
  loop: "{{ pam_operators_effective | default(pam_operators) }}"
  loop_control:
    loop_var: operator
    label: "{{ operator.name }}"

- name: Каталог для выдачи MFA-секретов инженерам (контроллер Ansible)
  ansible.builtin.file:
    path: "{{ pam_mfa_secrets_output_dir }}/{{ inventory_hostname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true

- name: Сохранение MFA-секретов для onboarding (контроллер Ansible)
  ansible.builtin.copy:
    dest: "{{ pam_mfa_secrets_output_dir }}/{{ inventory_hostname }}/{{ operator.name }}.mfa.txt"
    mode: "0600"
    content: |
      SSH PAM MFA — {{ operator.email | default(operator.name ~ '@' ~ (pam_lab_domain | default('example.com'))) }}
      Secret (base32): {{ operator_mfa_secret }}
      otpauth://totp/{{ pam_totp_issuer | replace(' ', '%20') }}:{{ (operator.email | default(operator.name ~ '@' ~ (pam_lab_domain | default('example.com')))) | urlencode }}?secret={{ operator_mfa_secret }}&issuer={{ pam_totp_issuer | replace(' ', '+') }}+Lab
  vars:
    operator_mfa_secret: "{{ operator_mfa_secrets[operator.name] }}"
  loop: "{{ pam_operators_effective | default(pam_operators) }}"
  loop_control:
    loop_var: operator
    label: "{{ operator.name }}"
  when: not (operator.dr_service | default(false) | bool)
  delegate_to: localhost
  become: false
  no_log: true
