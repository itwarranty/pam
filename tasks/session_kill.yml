---
# Remote session kill: ansible-playbook site.yml --tags session_kill -e pam_session_kill_id=...
- name: JIT — UID gateway (session kill)
  ansible.builtin.getent:
    database: passwd
    key: "{{ pam_user }}"

- name: Kill gateway session by id
  ansible.builtin.include_tasks: tasks/kill_gateway_sessions.yml
