---
- name: Проверка наличия доверенного образа (Air Gap)
  ansible.builtin.stat:
    path: "{{ bastion_image_tar }}"
  register: bastion_image_tar_stat

- name: Обязательный локальный образ для Air Gap
  ansible.builtin.fail:
    msg: >
      Образ не найден: {{ bastion_image_tar }}.
      Соберите его через build/Containerfile и trusted_download.sh
      на изолированной build-машине, затем перенесите архив на хост.
  when: not bastion_image_tar_stat.stat.exists

- name: Создание папки для конфигов SSH
  ansible.builtin.file:
    path: "{{ bastion_home }}/.ssh_config"
    state: directory
    owner: "{{ bastion_user }}"
    group: "{{ bastion_user }}"
    mode: "0700"

- name: Генерация sshd_config (Zero Trust + audited jump-host)
  ansible.builtin.template:
    src: sshd_config.j2
    dest: "{{ bastion_home }}/.ssh_config/sshd_config"
    owner: "{{ bastion_user }}"
    group: "{{ bastion_user }}"
    mode: "0600"
  notify: Restart ssh bastion container

- name: Pre-login SSH banner (operator UX)
  ansible.builtin.template:
    src: ssh-banner.txt.j2
    dest: "{{ bastion_home }}/.ssh_config/bastion-banner.txt"
    owner: "{{ bastion_user }}"
    group: "{{ bastion_user }}"
    mode: "0644"
  notify: Restart ssh bastion container

- name: Установка SSH User CA (mtglobal.team / org CA)
  ansible.builtin.copy:
    src: "{{ bastion_trusted_user_ca_file }}"
    dest: "{{ bastion_home }}/.ssh_config/trusted_user_ca.pub"
    owner: "{{ bastion_user }}"
    group: "{{ bastion_user }}"
    mode: "0644"
  when: bastion_trusted_user_ca_file | default('') | length > 0

- name: Список томов контейнера ssh_bastion
  ansible.builtin.set_fact:
    bastion_container_volumes:
      - "{{ bastion_home }}/.ssh_config/sshd_config:/etc/ssh/sshd_config:ro,Z"
      - "{{ bastion_home }}/.ssh_config/bastion-banner.txt:/etc/ssh/bastion-banner.txt:ro,Z"
      - "{{ operators_home }}:/etc/bastion/operators:ro,Z"
      - "{{ audit_log_dir }}:/var/log/bastion_sessions:rw,Z"

- name: Добавление тома SSH User CA
  ansible.builtin.set_fact:
    bastion_container_volumes: "{{ bastion_container_volumes + [bastion_home + '/.ssh_config/trusted_user_ca.pub:/etc/ssh/trusted_user_ca.pub:ro,Z'] }}"
  when: bastion_trusted_user_ca_file | default('') | length > 0

- name: Добавление тома shell command denylist
  ansible.builtin.set_fact:
    bastion_container_volumes: >-
      {{
        bastion_container_volumes
        + [bastion_home + '/command_policy/command_denylist:/etc/bastion/command_denylist:ro,Z']
      }}
  when: bastion_shell_command_policy_enabled | default(true) | bool

- name: Добавление тома bastion targets (Tier 3 gateway)
  ansible.builtin.set_fact:
    bastion_container_volumes: >-
      {{
        bastion_container_volumes
        + [bastion_targets_home + ':/etc/bastion/targets:ro,Z']
      }}
  when: bastion_targets | default([]) | length > 0

- name: Добавление тома gateway session registry (Tier 3)
  ansible.builtin.set_fact:
    bastion_container_volumes: >-
      {{
        bastion_container_volumes
        + [bastion_runtime_dir + '/sessions:/run/mt-bastion/sessions:rw,Z']
      }}
  when: bastion_targets | default([]) | length > 0

- name: Проверка /dev/log для проброса journald в контейнер
  ansible.builtin.stat:
    path: /dev/log
  register: bastion_dev_log_stat
  when: bastion_container_mount_dev_log | default(false) | bool

- name: Добавление тома /dev/log (journald для logger в контейнере)
  ansible.builtin.set_fact:
    bastion_container_volumes: >-
      {{
        bastion_container_volumes
        + ['/dev/log:/dev/log:rw']
      }}
  when:
    - bastion_container_mount_dev_log | default(false) | bool
    - bastion_dev_log_stat.stat.exists | default(false)

- name: Загрузка доверенного образа бастиона из локального архива (Air Gap)
  containers.podman.podman_load:
    input: "{{ bastion_image_tar }}"
  become: true
  become_user: "{{ bastion_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[bastion_user][1] }}"
  when: container_engine == "podman"

- name: "[CSO] Верификация immutable-образа (MFA strict label)"
  ansible.builtin.include_tasks: tasks/verify_image_cso.yml

- name: Запуск контейнера ssh_bastion (lab network)
  containers.podman.podman_container:
    name: mt_ssh_bastion
    image: "{{ bastion_image_name }}:{{ bastion_image_tag }}"
    state: started
    restart_policy: always
    network: "{{ bastion_gateway_lab_network }}"
    env:
      BASTION_GATEWAY_LAB_MODE: "{{ '1' if (bastion_gateway_lab_mode | default(false) | bool) else '0' }}"
      BASTION_GATEWAY_COMMAND_POLICY_V2_ENABLED: "{{ '1' if (bastion_gateway_command_policy_v2_enabled | default(true) | bool) else '0' }}"
      BASTION_SHELL_COMMAND_POLICY_V2_ENABLED: "{{ '1' if (bastion_shell_command_policy_v2_enabled | default(true) | bool) else '0' }}"
      BASTION_GATEWAY_DENY_KILL_SESSION: "{{ '1' if (bastion_gateway_deny_kill_session | default(false) | bool) else '0' }}"
    ports:
      - "{{ bastion_ssh_port }}:{{ bastion_ssh_port }}"
    volumes: "{{ bastion_container_volumes }}"
    recreate: true
  become: true
  become_user: "{{ bastion_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[bastion_user][1] }}"
  when:
    - container_engine == "podman"
    - bastion_gateway_lab_enabled | default(false) | bool

- name: Запуск контейнера ssh_bastion (default network)
  containers.podman.podman_container:
    name: mt_ssh_bastion
    image: "{{ bastion_image_name }}:{{ bastion_image_tag }}"
    state: started
    restart_policy: always
    env:
      BASTION_GATEWAY_LAB_MODE: "{{ '1' if (bastion_gateway_lab_mode | default(false) | bool) else '0' }}"
      BASTION_GATEWAY_COMMAND_POLICY_V2_ENABLED: "{{ '1' if (bastion_gateway_command_policy_v2_enabled | default(true) | bool) else '0' }}"
      BASTION_SHELL_COMMAND_POLICY_V2_ENABLED: "{{ '1' if (bastion_shell_command_policy_v2_enabled | default(true) | bool) else '0' }}"
      BASTION_GATEWAY_DENY_KILL_SESSION: "{{ '1' if (bastion_gateway_deny_kill_session | default(false) | bool) else '0' }}"
    ports:
      - "{{ bastion_ssh_port }}:{{ bastion_ssh_port }}"
    volumes: "{{ bastion_container_volumes }}"
    recreate: true
  become: true
  become_user: "{{ bastion_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[bastion_user][1] }}"
  when:
    - container_engine == "podman"
    - not (bastion_gateway_lab_enabled | default(false) | bool)
