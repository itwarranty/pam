---
# Install bastion-session-ctl on bastion host for CSO operators.
- name: bastion-session-ctl on host
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/scripts/bastion-session-ctl.sh"
    dest: /usr/local/bin/bastion-session-ctl
    owner: root
    group: root
    mode: "0755"
  when:
    - bastion_session_ctl_enabled | default(true) | bool
    - bastion_targets | default([]) | length > 0
