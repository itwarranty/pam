---
- name: Установка Podman, firewalld и auditd (Rocky Linux 9)
  ansible.builtin.package:
    name:
      - podman
      - slirp4netns
      - fuse-overlayfs
      - firewalld
      - audit
    state: present

- name: Включение и запуск firewalld
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true

- name: Включение и запуск auditd
  ansible.builtin.service:
    name: auditd
    state: started
    enabled: true

- name: Создание бесправного пользователя для Rootless контейнеров
  ansible.builtin.user:
    name: "{{ pam_user }}"
    shell: /bin/bash
    create_home: true
    home: "{{ pam_home }}"
    state: present

- name: Получение UID gateway-пользователя
  ansible.builtin.getent:
    database: passwd
    key: "{{ pam_user }}"

- name: Настройка лимитов subordinate UID/GID для Rootless Podman
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    line: "{{ pam_user }}:100000:65536"
    regexp: "^{{ pam_user }}:"
    create: true
    mode: "0644"
  loop:
    - /etc/subuid
    - /etc/subgid

- name: Включение Linger для работы контейнеров пользователя в фоне
  ansible.builtin.command: "loginctl enable-linger {{ pam_user }}"
  args:
    creates: "/var/lib/systemd/linger/{{ pam_user }}"

- name: Создание группы чтения audit-логов
  ansible.builtin.group:
    name: "{{ pam_audit_group }}"
    state: present

- name: Создание группы модераторов live-watch
  ansible.builtin.group:
    name: "{{ pam_moderators_group }}"
    state: present

- name: Добавление пользователя PAM в группу audit
  ansible.builtin.user:
    name: "{{ pam_user }}"
    groups: "{{ pam_audit_group }}"
    append: true

- name: Создание директории логов сессий (владелец gateway — rootless Podman + SELinux)
  ansible.builtin.file:
    path: "{{ audit_log_dir }}"
    state: directory
    owner: "{{ pam_user }}"
    group: "{{ pam_audit_group }}"
    mode: "{{ pam_audit_log_dir_mode | default('0750') }}"

- name: Shared gateway syslog file (container operators append)
  ansible.builtin.file:
    path: "{{ audit_log_dir }}/gateway.syslog"
    state: file
    owner: "{{ pam_user }}"
    group: "{{ pam_audit_group }}"
    mode: "{{ pam_audit_log_file_mode | default('0640') }}"
    modification_time: preserve
    access_time: preserve

- name: Session JSONL aggregate (moderation / SIEM)
  ansible.builtin.file:
    path: "{{ audit_log_dir }}/sessions.jsonl"
    state: file
    owner: "{{ pam_user }}"
    group: "{{ pam_audit_group }}"
    mode: "{{ pam_audit_log_file_mode | default('0640') }}"
    modification_time: preserve
    access_time: preserve

# Append-only (+a) — на *.log при создании (pam-shell-wrapper / entrypoint), не на каталог.

- name: Правила auditd для SSH и записи логов сессий
  ansible.builtin.template:
    src: auditd-pam.rules.j2
    dest: /etc/audit/rules.d/gateway.rules
    owner: root
    group: root
    mode: "0640"
  notify: Reload auditd rules

- name: Открытие порта шлюза в firewalld
  ansible.posix.firewalld:
    port: "{{ pam_ssh_port }}/tcp"
    permanent: true
    state: enabled
    immediate: true
  when: pam_allowed_source_cidrs | default([]) | length == 0
