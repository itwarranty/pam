---
# JIT access windows: filter pam_operators → pam_operators_active (purge-only v1).
- name: JIT — epoch на хосте шлюза
  ansible.builtin.command: date +%s
  register: pam_jit_now_cmd
  changed_when: false

- name: JIT — классификация операторов по valid_from / valid_until
  ansible.builtin.shell: |
    set -euo pipefail
    python3 <<'PY'
    import json, os
    from datetime import datetime

    ops = json.loads(os.environ["OPS"])

    def parse_ts(ts):
        if not ts:
            return None
        return int(datetime.fromisoformat(ts.replace("Z", "+00:00")).timestamp())

    now = int(datetime.now().astimezone().timestamp())
    active, revoked, reasons = [], [], {}

    for op in ops:
        name = op["name"]
        vf = parse_ts(op.get("valid_from") or "")
        vu = parse_ts(op.get("valid_until") or "")
        if vu is not None and now >= vu:
            revoked.append(name)
            reasons[name] = "expired"
        elif vf is not None and now < vf:
            revoked.append(name)
            reasons[name] = "not_yet_active"
        else:
            active.append(op)

    print(json.dumps({"active": active, "revoked": revoked, "reasons": reasons}))
    PY
  environment:
    OPS: "{{ pam_operators | to_json }}"
  register: pam_jit_filter
  changed_when: false

- name: JIT — эффективный список операторов
  ansible.builtin.set_fact:
    pam_operators_active: "{{ (pam_jit_filter.stdout | from_json).active }}"
    pam_jit_revoked_names: "{{ (pam_jit_filter.stdout | from_json).revoked }}"
    pam_jit_revoke_reasons: "{{ (pam_jit_filter.stdout | from_json).reasons }}"
    pam_operators_effective: "{{ (pam_jit_filter.stdout | from_json).active }}"

- name: JIT — отозванные по окну доступа
  ansible.builtin.debug:
    msg: >-
      JIT purge: {{ item }} ({{ pam_jit_revoke_reasons[item] }})
  loop: "{{ pam_jit_revoked_names }}"
  loop_control:
    label: "{{ item }}"
  when: pam_jit_revoked_names | length > 0
