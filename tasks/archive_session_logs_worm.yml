---
# Optional WORM archive: copy closed session logs + integrity sidecars (mtime stable).
- name: WORM archive — каталог назначения
  ansible.builtin.file:
    path: "{{ pam_worm_archive_dir }}"
    state: directory
    owner: "{{ pam_user }}"
    group: "{{ pam_user }}"
    mode: "0750"
  when: pam_worm_archive_dir | default('') | length > 0

- name: WORM archive — закрытые session logs (mtime стабилен)
  ansible.builtin.shell: |
    set -euo pipefail
    archive="{{ pam_worm_archive_dir }}"
    min_age="{{ pam_worm_archive_min_age_minutes | default(5) }}"
    now=$(date +%s)
    for log in {{ audit_log_dir }}/session_*.log; do
      [ -f "$log" ] || continue
      age_min=$(( (now - $(stat -c %Y "$log")) / 60 ))
      [ "$age_min" -ge "$min_age" ] || continue
      base=$(basename "$log")
      install -m 0640 -o {{ pam_user }} -g {{ pam_user }} "$log" "${archive}/${base}"
      for ext in sha256 meta; do
        [ -f "${log}.${ext}" ] && install -m 0640 -o {{ pam_user }} -g {{ pam_user }} \
          "${log}.${ext}" "${archive}/${base}.${ext}"
      done
    done
  args:
    executable: /bin/bash
  changed_when: true
  when: pam_worm_archive_dir | default('') | length > 0
