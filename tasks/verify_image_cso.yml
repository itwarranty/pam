---
- name: "[CSO] Inspect загруженного образа шлюза"
  ansible.builtin.command:
    argv:
      - podman
      - image
      - inspect
      - "{{ pam_image_name }}:{{ pam_image_tag }}"
      - --format
      - json
  become: true
  become_user: "{{ pam_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[pam_user][1] }}"
  register: pam_image_inspect
  changed_when: false

- name: "[CSO] Образ должен быть собран с MFA_STRICT=1"
  ansible.builtin.assert:
    that:
      - (pam_image_inspect.stdout | from_json)[0].Config.Labels['pam.mfa.strict'] | default('') | string == pam_required_image_mfa_strict
    fail_msg: >
      Образ {{ pam_image_name }}:{{ pam_image_tag }} не прошёл CSO-верификацию.
      OCI-label pam.mfa.strict должен быть '{{ pam_required_image_mfa_strict }}'.
      Пересоберите: ./trusted_download.sh
