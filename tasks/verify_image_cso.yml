---
- name: "[CSO] Inspect загруженного образа бастиона"
  ansible.builtin.command:
    argv:
      - podman
      - image
      - inspect
      - "{{ bastion_image_name }}:{{ bastion_image_tag }}"
      - --format
      - json
  become: true
  become_user: "{{ bastion_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[bastion_user][1] }}"
  register: bastion_image_inspect
  changed_when: false

- name: "[CSO] Образ должен быть собран с MFA_STRICT=1"
  ansible.builtin.assert:
    that:
      - (bastion_image_inspect.stdout | from_json)[0].Config.Labels['mt.global.mfa.strict'] | default('') | string == bastion_required_image_mfa_strict
    fail_msg: >
      Образ {{ bastion_image_name }}:{{ bastion_image_tag }} не прошёл CSO-верификацию.
      OCI-label mt.global.mfa.strict должен быть '{{ bastion_required_image_mfa_strict }}'.
      Пересоберите: ./trusted_download.sh
