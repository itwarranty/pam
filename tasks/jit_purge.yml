---
# Standalone JIT expiry purge: ansible-playbook site.yml --tags jit_purge
- name: JIT — UID bastion-пользователя (purge)
  ansible.builtin.getent:
    database: passwd
    key: "{{ bastion_user }}"

- name: JIT — фильтр окон доступа
  ansible.builtin.include_tasks: tasks/jit_filter_operators.yml

- name: JIT — purge отозванных / истёкших операторов
  ansible.builtin.include_tasks: tasks/purge_revoked_operators.yml
