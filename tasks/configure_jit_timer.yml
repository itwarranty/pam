---
# systemd timer: periodic JIT purge on the gateway host (client runs playbook).
- name: JIT timer — скрипт purge на хосте
  ansible.builtin.template:
    src: pam-jit-purge.sh.j2
    dest: "{{ pam_jit_purge_script_path }}"
    owner: root
    group: root
    mode: "0750"

- name: JIT timer — systemd service
  ansible.builtin.template:
    src: pam-jit-purge.service.j2
    dest: /etc/systemd/system/pam-jit-purge.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload JIT systemd timer

- name: JIT timer — systemd timer unit
  ansible.builtin.template:
    src: pam-jit-purge.timer.j2
    dest: /etc/systemd/system/pam-jit-purge.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload JIT systemd timer

- name: JIT timer — включение
  ansible.builtin.systemd:
    name: pam-jit-purge.timer
    enabled: true
    state: started
    daemon_reload: true
  when: pam_jit_timer_enabled | bool

- name: JIT timer — отключение
  ansible.builtin.systemd:
    name: pam-jit-purge.timer
    enabled: false
    state: stopped
  when: not (pam_jit_timer_enabled | bool)
