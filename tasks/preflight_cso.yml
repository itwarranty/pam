---
- name: "[CSO] Rocky Linux 9.x — единственная поддерживаемая ОС хоста"
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == pam_required_os
      - ansible_facts['distribution_major_version'] == pam_required_os_major
    fail_msg: >
      SSH PAM поддерживается только на {{ pam_required_os }}
      {{ pam_required_os_major }}.x (Enterprise LTS).
      Обнаружено: {{ ansible_facts['distribution'] }}
      {{ ansible_facts['distribution_version'] }}.
      Что сделать: разверните Rocky Linux {{ pam_required_os_major }} x86_64
      (lab: ./scripts/pam up — Lima Rocky 9).

- name: "[CSO] Архитектура x86_64"
  ansible.builtin.assert:
    that:
      - ansible_facts['architecture'] == pam_required_arch
    fail_msg: >
      Поддерживается только {{ pam_required_arch }}.
      Обнаружено: {{ ansible_facts['architecture'] }}.

- name: "[CSO] SELinux Enforcing обязателен"
  ansible.builtin.command: getenforce
  register: selinux_state
  changed_when: false
  when: pam_selinux_enforcing | bool

- name: "[CSO] Проверка режима SELinux"
  ansible.builtin.assert:
    that:
      - selinux_state.stdout == 'Enforcing'
    fail_msg: >
      SELinux должен быть в режиме Enforcing (текущий: {{ selinux_state.stdout }}).
      Что сделать: setenforce 1; в /etc/selinux/config задайте SELINUX=enforcing.
  when: pam_selinux_enforcing | bool

- name: "[CSO] Только Rootless Podman"
  ansible.builtin.assert:
    that:
      - container_engine == 'podman'
    fail_msg: >
      container_engine={{ container_engine }} не поддерживается.
      Решение CSO: только rootless Podman на Rocky Linux 9.

- name: "[CSO] Whitelist PermitOpen обязателен"
  ansible.builtin.assert:
    that:
      - pam_permitted_targets | length > 0
    fail_msg: >
      pam_permitted_targets пуст. Jump-host без whitelist не разворачивается.
      Что сделать: добавьте host:port в pam_permitted_targets
      (lab: group_vars/dev/gateway_lab.yml уже содержит пример).
  when:
    - not (is_commercial_pam | bool)
    - pam_allow_tcp_forwarding | bool

- name: "[CSO] Strict MFA обязателен"
  ansible.builtin.assert:
    that:
      - pam_mfa_enforce | bool
    fail_msg: >
      pam_mfa_enforce=false запрещён политикой CSO.
      Образ должен быть собран с MFA_STRICT=1 (./trusted_download.sh).

- name: "[CSO] Command policy v2 обязателен при включённом denylist"
  ansible.builtin.assert:
    that:
      - pam_gateway_command_policy_v2_enabled | default(true) | bool
      - pam_shell_command_policy_v2_enabled | default(true) | bool
    fail_msg: >
      pam_command_policy_v2_required=true: gateway/shell policy v2 MUST be enabled.
      v1 (remote bash --rcfile на target) — только migration с pam_command_policy_v2_required: false
      и formal risk acceptance.
  when:
    - pam_command_policy_v2_required | default(true) | bool
    - pam_shell_command_policy_enabled | default(true) | bool
    - not (is_commercial_pam | bool)

- name: "[CSO] Операторы должны быть определены до деплоя"
  ansible.builtin.assert:
    that:
      - pam_operators | length > 0
    fail_msg: >
      pam_operators пуст. Шлюз без явного списка операторов не разворачивается.
      Что сделать: заполните pam_operators (Vault) или для lab используйте
      group_vars/dev/ и ./scripts/pam up.
  when: not (is_commercial_pam | bool)

- name: "[CSO] Source IP обязателен для каждого оператора (strict mode)"
  ansible.builtin.assert:
    that:
      - item.allowed_sources | default([]) | length > 0
    fail_msg: >
      pam_require_source_ip=true: оператор «{{ item.name }}» не имеет allowed_sources.
      Задайте CIDR/IP в pam_operators или отключите strict mode.
  loop: "{{ pam_operators }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - pam_require_source_ip | default(false) | bool
    - not (is_commercial_pam | bool)

- name: "[CSO] SIEM forward требует pam_siem_server"
  ansible.builtin.assert:
    that:
      - pam_siem_server | default('') | length > 0
    fail_msg: >
      pam_siem_forward_enabled=true, но pam_siem_server пуст.
  when: pam_siem_forward_enabled | default(false) | bool

- name: "[CSO] Prod: raw pubkey без certificate запрещён"
  ansible.builtin.assert:
    that:
      - item.certificate | default('') | length > 0
    fail_msg: >
      pam_allow_raw_pubkey_prod=false: оператор «{{ item.name }}» использует raw pubkey.
      Подпишите SSH user certificate (≤ {{ pam_cert_max_validity_hours }}h) или задайте
      pam_allow_raw_pubkey_prod=true с formal CSO waiver.
  loop: "{{ pam_operators }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - not (pam_allow_raw_pubkey_prod | default(false) | bool)
    - not (is_commercial_pam | bool)
    - item.pubkey | default('') | length > 0
    - item.certificate | default('') | length == 0

- name: "[CSO] SSH User CA prod: QA sign-off рекомендуется"
  ansible.builtin.debug:
    msg: >
      ВНИМАНИЕ: pam_ssh_user_ca_qa_complete=false — prod certificate mode не прошёл QA
      (openspec/changes/archive/2026-06-ssh-user-ca-qa). Raw pubkey waiver активен только
      при pam_allow_raw_pubkey_prod=true.
  when:
    - not (pam_ssh_user_ca_qa_complete | default(false) | bool)
    - not (pam_allow_raw_pubkey_prod | default(false) | bool)
    - not (is_commercial_pam | bool)

- name: "[CSO] Допустимые значения access (jump|shell|audit|gateway)"
  ansible.builtin.assert:
    that:
      - item.access | default('jump') in ['jump', 'shell', 'audit', 'gateway']
    fail_msg: >
      Оператор «{{ item.name }}»: access={{ item.access | default('jump') }} недопустим.
      Разрешены: jump, shell, audit, gateway.
  loop: "{{ pam_operators }}"
  loop_control:
    label: "{{ item.name }}"
  when: not (is_commercial_pam | bool)

- name: "[CSO] access: gateway запрещён в ветке commercial PAM"
  ansible.builtin.assert:
    that:
      - item.access | default('jump') != 'gateway'
    fail_msg: >
      Оператор «{{ item.name }}» с access: gateway не поддерживается при is_commercial_pam=true.
  loop: "{{ pam_operators }}"
  loop_control:
    label: "{{ item.name }}"
  when: is_commercial_pam | bool

- name: "[CSO] access: audit запрещён в ветке commercial PAM"
  ansible.builtin.assert:
    that:
      - item.access | default('jump') != 'audit'
    fail_msg: >
      Оператор «{{ item.name }}» с access: audit не поддерживается при is_commercial_pam=true.
  loop: "{{ pam_operators }}"
  loop_control:
    label: "{{ item.name }}"
  when: is_commercial_pam | bool

- name: "[CSO] Break-glass без gate flag"
  ansible.builtin.assert:
    that:
      - not (item.break_glass | default(false) | bool)
    fail_msg: >
      Оператор «{{ item.name }}»: break_glass=true, но pam_break_glass_enabled=false.
      Включите gate в group_vars или уберите break_glass.
  loop: "{{ pam_operators }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - not (pam_break_glass_enabled | default(false) | bool)
    - not (is_commercial_pam | bool)

- name: "[CSO] Break-glass требует incident_id и valid_until"
  ansible.builtin.assert:
    that:
      - item.incident_id | default('') | length > 0
      - item.valid_until | default('') | length > 0
    fail_msg: >
      Оператор «{{ item.name }}» (break_glass): обязательны incident_id и valid_until.
  loop: "{{ pam_operators }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.break_glass | default(false) | bool
    - not (is_commercial_pam | bool)

- name: "[CSO] Break-glass максимальное окно (часы)"
  ansible.builtin.shell: |
    set -euo pipefail
    python3 <<'PY'
    import json, os, sys
    from datetime import datetime

    op = json.loads(os.environ["OP"])
    max_h = float(os.environ["MAX_H"])
    vf = op.get("valid_from") or ""
    vu = op.get("valid_until") or ""

    def parse(ts):
        return datetime.fromisoformat(ts.replace("Z", "+00:00"))

    end = parse(vu)
    start = parse(vf) if vf else datetime.now().astimezone()
    hours = (end - start).total_seconds() / 3600.0
    if hours > max_h:
        print(f"window {hours:.1f}h > max {max_h}h", file=sys.stderr)
        sys.exit(1)
    PY
  environment:
    OP: "{{ item | to_json }}"
    MAX_H: "{{ pam_break_glass_max_hours | string }}"
  changed_when: false
  loop: "{{ pam_operators }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.break_glass | default(false) | bool
    - not (is_commercial_pam | bool)

- name: "[CSO] Индекс pam_targets host:port"
  ansible.builtin.set_fact:
    pam_target_host_ports: >-
      {{
        pam_target_host_ports | default([])
        + [target_item.host ~ ':' ~ (target_item.port | default(22) | string)]
      }}
  loop: "{{ pam_targets | default([]) }}"
  loop_control:
    loop_var: target_item
    label: "{{ target_item.id }}"
  when: not (is_commercial_pam | bool)

- name: "[CSO] Gateway operator permit_open resolves to gateway_targets"
  ansible.builtin.assert:
    that:
      - permit_entry in pam_target_host_ports
    fail_msg: >
      Оператор «{{ item.0.name }}» (gateway): permit_open «{{ permit_entry }}»
      не найден в pam_targets.
  vars:
    permit_entry: "{{ item.1 }}"
  loop: >-
    {{
      query(
        'subelements',
        pam_operators | selectattr('access', 'equalto', 'gateway') | list,
        'permit_open',
        skip_missing=True
      )
    }}
  loop_control:
    label: "{{ item.0.name }}:{{ item.1 }}"
  when:
    - not (is_commercial_pam | bool)
    - pam_targets | default([]) | length > 0

- name: "[CSO] Gateway operator requires permit_open"
  ansible.builtin.assert:
    that:
      - item.permit_open | default([]) | length > 0
    fail_msg: >
      Оператор «{{ item.name }}» (gateway): permit_open обязателен.
  loop: "{{ pam_operators | selectattr('access', 'equalto', 'gateway') | list }}"
  loop_control:
    label: "{{ item.name }}"
  when: not (is_commercial_pam | bool)

- name: "[CSO] Target identity file exists"
  ansible.builtin.stat:
    path: "{{ item.identity_file }}"
  register: target_key_stat
  loop: "{{ pam_targets | default([]) }}"
  loop_control:
    label: "{{ item.id }}"
  when: not (is_commercial_pam | bool)

- name: "[CSO] Target identity file present"
  ansible.builtin.assert:
    that:
      - target_key_stat.results[idx].stat.exists
    fail_msg: >
      pam_targets «{{ item.id }}»: identity_file не найден: {{ item.identity_file }}
  loop: "{{ pam_targets | default([]) }}"
  loop_control:
    label: "{{ item.id }}"
    index_var: idx
  when: not (is_commercial_pam | bool)

- name: "[CSO] Target host_key_fingerprint missing (warn)"
  ansible.builtin.debug:
    msg: >
      ВНИМАНИЕ: pam_targets «{{ item.id }}» без host_key_fingerprint —
      MITM risk. Задайте fingerprint или lab mode только в dev.
  loop: "{{ pam_targets | default([]) }}"
  loop_control:
    label: "{{ item.id }}"
  when:
    - not (is_commercial_pam | bool)
    - not (pam_gateway_lab_mode | default(false) | bool)
    - item.host_key_fingerprint | default('') | length == 0

- name: "[CSO] Jump/gateway prod policy check"
  ansible.builtin.script:
    cmd: "{{ playbook_dir }}/scripts/preflight-jump-gateway.py"
  environment:
    OPERATORS: "{{ pam_operators | to_json }}"
    TARGETS: "{{ pam_targets | default([]) | to_json }}"
    PROD_REQUIRE_GATEWAY: "{{ pam_prod_require_gateway | default(false) | ternary('true', 'false') }}"
    PROD_TAGS: "{{ pam_prod_target_tags | default(['prod']) | to_json }}"
    JUMP_RISK: "{{ pam_jump_risk_acceptance_required | default(false) | ternary('true', 'false') }}"
  changed_when: false
  when:
    - not (is_commercial_pam | bool)
    - pam_prod_require_gateway | default(false) | bool
      or pam_jump_risk_acceptance_required | default(false) | bool

- name: "[CSO] Target vault_path vs identity_file mutually exclusive"
  ansible.builtin.assert:
    that:
      - not (item.identity_file | default('') | length > 0 and item.vault_secret_path | default('') | length > 0)
    fail_msg: >
      pam_targets «{{ item.id }}»: задайте identity_file ИЛИ vault_secret_path, не оба.
  loop: "{{ pam_targets | default([]) }}"
  loop_control:
    label: "{{ item.id }}"
  when: not (is_commercial_pam | bool)

- name: "[CSO] Vault enabled requires pam_vault_addr"
  ansible.builtin.assert:
    that:
      - pam_vault_addr | default('') | length > 0
      - pam_vault_token | default('') | length > 0
    fail_msg: "pam_vault_enabled=true: задайте pam_vault_addr и pam_vault_token (Vault)."
  when:
    - pam_vault_enabled | default(false) | bool
    - not (is_commercial_pam | bool)

- name: "[CSO] OIDC cert policy requires operator certificate"
  ansible.builtin.assert:
    that:
      - item.certificate | default('') | length > 0
    fail_msg: >
      pam_oidc_cert_policy_enabled: оператор «{{ item.name }}» должен использовать certificate.
  loop: "{{ pam_operators }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - pam_oidc_cert_policy_enabled | default(false) | bool
    - not (is_commercial_pam | bool)
    - item.pubkey | default('') | length > 0
    - item.certificate | default('') | length == 0

- name: "[CSO] FIDO-Anchor operator key policy (Tier 5)"
  ansible.builtin.include_tasks: preflight_fido_operators.yml
  when: not (is_commercial_pam | bool)
