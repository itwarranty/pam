---
- name: "[CSO] Rocky Linux 9.x — единственная поддерживаемая ОС хоста"
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == bastion_required_os
      - ansible_facts['distribution_major_version'] == bastion_required_os_major
    fail_msg: >
      MT Bastion поддерживается только на {{ bastion_required_os }}
      {{ bastion_required_os_major }}.x (Enterprise LTS).
      Обнаружено: {{ ansible_facts['distribution'] }}
      {{ ansible_facts['distribution_version'] }}.
      Другие дистрибутивы не проходят ИБ-аудит и блокируются политикой CSO.

- name: "[CSO] Архитектура x86_64"
  ansible.builtin.assert:
    that:
      - ansible_facts['architecture'] == bastion_required_arch
    fail_msg: >
      Поддерживается только {{ bastion_required_arch }}.
      Обнаружено: {{ ansible_facts['architecture'] }}.

- name: "[CSO] SELinux Enforcing обязателен"
  ansible.builtin.command: getenforce
  register: selinux_state
  changed_when: false
  when: bastion_selinux_enforcing | bool

- name: "[CSO] Проверка режима SELinux"
  ansible.builtin.assert:
    that:
      - selinux_state.stdout == 'Enforcing'
    fail_msg: >
      SELinux должен быть в режиме Enforcing (текущий: {{ selinux_state.stdout }}).
      Permissive/Disabled не допускаются — нарушается MAC-изоляция контейнера (:Z).
  when: bastion_selinux_enforcing | bool

- name: "[CSO] Только Rootless Podman"
  ansible.builtin.assert:
    that:
      - container_engine == 'podman'
    fail_msg: >
      container_engine={{ container_engine }} не поддерживается.
      Решение CSO: только rootless Podman на Rocky Linux 9.

- name: "[CSO] Whitelist PermitOpen обязателен"
  ansible.builtin.assert:
    that:
      - bastion_permitted_targets | length > 0
    fail_msg: >
      bastion_permitted_targets пуст. Jump-host без whitelist не разворачивается —
      это создаёт неконтролируемый транзитный доступ.
  when:
    - not (is_commercial_pam | bool)
    - bastion_allow_tcp_forwarding | bool

- name: "[CSO] Strict MFA обязателен"
  ansible.builtin.assert:
    that:
      - bastion_mfa_enforce | bool
    fail_msg: >
      bastion_mfa_enforce=false запрещён политикой CSO.
      Образ должен быть собран с MFA_STRICT=1 (./trusted_download.sh).

- name: "[CSO] Операторы должны быть определены до деплоя"
  ansible.builtin.assert:
    that:
      - bastion_operators | length > 0
    fail_msg: >
      bastion_operators пуст. Бастион без явного списка операторов не разворачивается.
  when: not (is_commercial_pam | bool)

- name: "[CSO] Source IP обязателен для каждого оператора (strict mode)"
  ansible.builtin.assert:
    that:
      - item.allowed_sources | default([]) | length > 0
    fail_msg: >
      bastion_require_source_ip=true: оператор «{{ item.name }}» не имеет allowed_sources.
      Задайте CIDR/IP в bastion_operators или отключите strict mode.
  loop: "{{ bastion_operators }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - bastion_require_source_ip | default(false) | bool
    - not (is_commercial_pam | bool)

- name: "[CSO] SIEM forward требует bastion_siem_server"
  ansible.builtin.assert:
    that:
      - bastion_siem_server | default('') | length > 0
    fail_msg: >
      bastion_siem_forward_enabled=true, но bastion_siem_server пуст.
  when: bastion_siem_forward_enabled | default(false) | bool

- name: "[CSO] Prod: raw pubkey без certificate запрещён"
  ansible.builtin.assert:
    that:
      - item.certificate | default('') | length > 0
    fail_msg: >
      bastion_allow_raw_pubkey_prod=false: оператор «{{ item.name }}» использует raw pubkey.
      Подпишите SSH user certificate (≤ {{ bastion_cert_max_validity_hours }}h) или задайте
      bastion_allow_raw_pubkey_prod=true с formal CSO waiver.
  loop: "{{ bastion_operators }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - not (bastion_allow_raw_pubkey_prod | default(false) | bool)
    - not (is_commercial_pam | bool)
    - item.pubkey | default('') | length > 0
    - item.certificate | default('') | length == 0

- name: "[CSO] SSH User CA prod: QA sign-off рекомендуется"
  ansible.builtin.debug:
    msg: >
      ВНИМАНИЕ: bastion_ssh_user_ca_qa_complete=false — prod certificate mode не прошёл QA
      (openspec/changes/archive/2026-06-ssh-user-ca-qa-mtglobal). Raw pubkey waiver активен только
      при bastion_allow_raw_pubkey_prod=true.
  when:
    - not (bastion_ssh_user_ca_qa_complete | default(false) | bool)
    - not (bastion_allow_raw_pubkey_prod | default(false) | bool)
    - not (is_commercial_pam | bool)

- name: "[CSO] Допустимые значения access (jump|shell|audit)"
  ansible.builtin.assert:
    that:
      - item.access | default('jump') in ['jump', 'shell', 'audit']
    fail_msg: >
      Оператор «{{ item.name }}»: access={{ item.access | default('jump') }} недопустим.
      Разрешены: jump, shell, audit.
  loop: "{{ bastion_operators }}"
  loop_control:
    label: "{{ item.name }}"
  when: not (is_commercial_pam | bool)

- name: "[CSO] access: audit запрещён в ветке commercial PAM"
  ansible.builtin.assert:
    that:
      - item.access | default('jump') != 'audit'
    fail_msg: >
      Оператор «{{ item.name }}» с access: audit не поддерживается при is_commercial_pam=true.
  loop: "{{ bastion_operators }}"
  loop_control:
    label: "{{ item.name }}"
  when: is_commercial_pam | bool

- name: "[CSO] Break-glass без gate flag"
  ansible.builtin.assert:
    that:
      - not (item.break_glass | default(false) | bool)
    fail_msg: >
      Оператор «{{ item.name }}»: break_glass=true, но bastion_break_glass_enabled=false.
      Включите gate в group_vars или уберите break_glass.
  loop: "{{ bastion_operators }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - not (bastion_break_glass_enabled | default(false) | bool)
    - not (is_commercial_pam | bool)

- name: "[CSO] Break-glass требует incident_id и valid_until"
  ansible.builtin.assert:
    that:
      - item.incident_id | default('') | length > 0
      - item.valid_until | default('') | length > 0
    fail_msg: >
      Оператор «{{ item.name }}» (break_glass): обязательны incident_id и valid_until.
  loop: "{{ bastion_operators }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.break_glass | default(false) | bool
    - not (is_commercial_pam | bool)

- name: "[CSO] Break-glass максимальное окно (часы)"
  ansible.builtin.shell: |
    set -euo pipefail
    python3 <<'PY'
    import json, os, sys
    from datetime import datetime

    op = json.loads(os.environ["OP"])
    max_h = float(os.environ["MAX_H"])
    vf = op.get("valid_from") or ""
    vu = op.get("valid_until") or ""

    def parse(ts):
        return datetime.fromisoformat(ts.replace("Z", "+00:00"))

    end = parse(vu)
    start = parse(vf) if vf else datetime.now().astimezone()
    hours = (end - start).total_seconds() / 3600.0
    if hours > max_h:
        print(f"window {hours:.1f}h > max {max_h}h", file=sys.stderr)
        sys.exit(1)
    PY
  environment:
    OP: "{{ item | to_json }}"
    MAX_H: "{{ bastion_break_glass_max_hours | string }}"
  changed_when: false
  loop: "{{ bastion_operators }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.break_glass | default(false) | bool
    - not (is_commercial_pam | bool)
