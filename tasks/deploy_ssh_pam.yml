---
- name: Проверка наличия доверенного образа (Air Gap)
  ansible.builtin.stat:
    path: "{{ pam_image_tar }}"
  register: pam_image_tar_stat

- name: Обязательный локальный образ для Air Gap
  ansible.builtin.fail:
    msg: >
      Образ не найден: {{ pam_image_tar }}.
      Соберите его через build/Containerfile и trusted_download.sh
      на изолированной build-машине, затем перенесите архив на хост.
  when: not pam_image_tar_stat.stat.exists

- name: Создание папки для конфигов SSH
  ansible.builtin.file:
    path: "{{ pam_home }}/.ssh_config"
    state: directory
    owner: "{{ pam_user }}"
    group: "{{ pam_user }}"
    mode: "0700"

- name: Генерация sshd_config (Zero Trust + audited jump-host)
  ansible.builtin.template:
    src: sshd_config.j2
    dest: "{{ pam_home }}/.ssh_config/sshd_config"
    owner: "{{ pam_user }}"
    group: "{{ pam_user }}"
    mode: "0600"
  notify: Restart ssh pam container

- name: Pre-login SSH banner (operator UX)
  ansible.builtin.template:
    src: ssh-banner.txt.j2
    dest: "{{ pam_home }}/.ssh_config/gateway-banner.txt"
    owner: "{{ pam_user }}"
    group: "{{ pam_user }}"
    mode: "0644"
  notify: Restart ssh pam container

- name: Установка SSH User CA (example.com / org CA)
  ansible.builtin.copy:
    src: "{{ pam_trusted_user_ca_file }}"
    dest: "{{ pam_home }}/.ssh_config/trusted_user_ca.pub"
    owner: "{{ pam_user }}"
    group: "{{ pam_user }}"
    mode: "0644"
  when: pam_trusted_user_ca_file | default('') | length > 0

- name: Список томов контейнера ssh_pam
  ansible.builtin.set_fact:
    pam_container_volumes:
      - "{{ pam_home }}/.ssh_config/sshd_config:/etc/ssh/sshd_config:ro,Z"
      - "{{ pam_home }}/.ssh_config/gateway-banner.txt:/etc/ssh/gateway-banner.txt:ro,Z"
      - "{{ operators_home }}:/etc/ssh-pam/operators:ro,Z"
      - "{{ audit_log_dir }}:/var/log/pam_sessions:rw,Z"

- name: Добавление тома SSH User CA
  ansible.builtin.set_fact:
    pam_container_volumes: "{{ pam_container_volumes + [pam_home + '/.ssh_config/trusted_user_ca.pub:/etc/ssh/trusted_user_ca.pub:ro,Z'] }}"
  when: pam_trusted_user_ca_file | default('') | length > 0

- name: Добавление тома shell command denylist
  ansible.builtin.set_fact:
    pam_container_volumes: >-
      {{
        pam_container_volumes
        + [pam_home + '/command_policy/command_denylist:/etc/ssh-pam/command_denylist:ro,Z']
      }}
  when: pam_shell_command_policy_enabled | default(true) | bool

- name: Добавление тома gateway targets (Tier 3 gateway)
  ansible.builtin.set_fact:
    pam_container_volumes: >-
      {{
        pam_container_volumes
        + [pam_targets_home + ':/etc/ssh-pam/targets:ro,Z']
      }}
  when: pam_targets | default([]) | length > 0

- name: Добавление тома gateway session registry (Tier 3)
  ansible.builtin.set_fact:
    pam_container_volumes: >-
      {{
        pam_container_volumes
        + [pam_runtime_dir + '/sessions:/run/ssh-pam/sessions:rw,Z']
      }}
  when: pam_targets | default([]) | length > 0

- name: Проверка /dev/log для проброса journald в контейнер
  ansible.builtin.stat:
    path: /dev/log
  register: pam_dev_log_stat
  when: pam_container_mount_dev_log | default(false) | bool

- name: Добавление тома /dev/log (journald для logger в контейнере)
  ansible.builtin.set_fact:
    pam_container_volumes: >-
      {{
        pam_container_volumes
        + ['/dev/log:/dev/log:rw']
      }}
  when:
    - pam_container_mount_dev_log | default(false) | bool
    - pam_dev_log_stat.stat.exists | default(false)

- name: Загрузка доверенного образа шлюза из локального архива (Air Gap)
  containers.podman.podman_load:
    input: "{{ pam_image_tar }}"
  become: true
  become_user: "{{ pam_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[pam_user][1] }}"
  when: container_engine == "podman"

- name: "[CSO] Верификация immutable-образа (MFA strict label)"
  ansible.builtin.include_tasks: tasks/verify_image_cso.yml

- name: Запуск контейнера ssh_pam (lab network)
  containers.podman.podman_container:
    name: "{{ pam_container_name }}"
    image: "{{ pam_image_name }}:{{ pam_image_tag }}"
    state: started
    restart_policy: always
    network: "{{ pam_gateway_lab_network }}"
    env:
      PAM_GATEWAY_LAB_MODE: "{{ '1' if (pam_gateway_lab_mode | default(false) | bool) else '0' }}"
      PAM_GATEWAY_COMMAND_POLICY_V2_ENABLED: "{{ '1' if (pam_gateway_command_policy_v2_enabled | default(true) | bool) else '0' }}"
      PAM_SHELL_COMMAND_POLICY_V2_ENABLED: "{{ '1' if (pam_shell_command_policy_v2_enabled | default(true) | bool) else '0' }}"
      PAM_GATEWAY_DENY_KILL_SESSION: "{{ '1' if (pam_gateway_deny_kill_session | default(false) | bool) else '0' }}"
    ports:
      - "{{ pam_ssh_port }}:{{ pam_ssh_port }}"
    volumes: "{{ pam_container_volumes }}"
    recreate: true
  become: true
  become_user: "{{ pam_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[pam_user][1] }}"
  when:
    - container_engine == "podman"
    - pam_gateway_lab_enabled | default(false) | bool

- name: Запуск контейнера ssh_pam (default network)
  containers.podman.podman_container:
    name: "{{ pam_container_name }}"
    image: "{{ pam_image_name }}:{{ pam_image_tag }}"
    state: started
    restart_policy: always
    env:
      PAM_GATEWAY_LAB_MODE: "{{ '1' if (pam_gateway_lab_mode | default(false) | bool) else '0' }}"
      PAM_GATEWAY_COMMAND_POLICY_V2_ENABLED: "{{ '1' if (pam_gateway_command_policy_v2_enabled | default(true) | bool) else '0' }}"
      PAM_SHELL_COMMAND_POLICY_V2_ENABLED: "{{ '1' if (pam_shell_command_policy_v2_enabled | default(true) | bool) else '0' }}"
      PAM_GATEWAY_DENY_KILL_SESSION: "{{ '1' if (pam_gateway_deny_kill_session | default(false) | bool) else '0' }}"
    ports:
      - "{{ pam_ssh_port }}:{{ pam_ssh_port }}"
    volumes: "{{ pam_container_volumes }}"
    recreate: true
  become: true
  become_user: "{{ pam_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[pam_user][1] }}"
  when:
    - container_engine == "podman"
    - not (pam_gateway_lab_enabled | default(false) | bool)
