---
- name: Count active gateway sessions before disruptive deploy
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - "{{ pam_container_name }}"
      - sh
      - -c
      - 'ls -1 /run/ssh-pam/sessions/*.json 2>/dev/null | wc -l'
  register: pam_active_session_count
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ pam_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[pam_user][1] }}"
  when:
    - container_engine == 'podman'
    - not (is_commercial_pam | bool)
    - pam_targets | default([]) | length > 0

- name: List active session ids when override is used
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - "{{ pam_container_name }}"
      - sh
      - -c
      - 'basename -a /run/ssh-pam/sessions/*.json 2>/dev/null | sed "s/\\.json$//"'
  register: pam_active_session_ids
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ pam_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[pam_user][1] }}"
  when:
    - container_engine == 'podman'
    - not (is_commercial_pam | bool)
    - pam_targets | default([]) | length > 0
    - (pam_active_session_count.stdout | default('0') | trim | int) > 0
    - pam_deploy_disrupt_active_sessions | default(false) | bool

- name: Warn about sessions affected by disruptive deploy override
  ansible.builtin.debug:
    msg: >
      pam_deploy_disrupt_active_sessions=true: continuing deploy with active sessions:
      {{ pam_active_session_ids.stdout_lines | default([]) | join(', ') }}
  when:
    - pam_active_session_ids is defined
    - pam_active_session_ids.stdout_lines | default([]) | length > 0

- name: Block deploy while active gateway sessions exist
  ansible.builtin.fail:
    msg: >
      Active gateway sessions detected ({{ pam_active_session_count.stdout | trim }}).
      Wait for sessions to end or set pam_deploy_disrupt_active_sessions: true.
  when:
    - pam_active_session_count is defined
    - (pam_active_session_count.stdout | default('0') | trim | int) > 0
    - not (pam_deploy_disrupt_active_sessions | default(false) | bool)
