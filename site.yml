---
- name: "Развертывание защищенного контура доступа MT: Bastion"
  hosts: bastion_servers
  become: true
  gather_facts: true

  handlers:
    - name: Reload auditd rules
      ansible.builtin.command: augenrules --load
      changed_when: true

    - name: Restart ssh bastion container
      ansible.builtin.shell: |
        set -e
        podman restart mt_ssh_bastion
        for u in {{ bastion_revoked_operator_names | default([]) | join(' ') }}; do
          [ -n "$u" ] || continue
          podman exec mt_ssh_bastion deluser -r "$u" 2>/dev/null || true
          podman exec mt_ssh_bastion rm -rf "/home/$u" 2>/dev/null || true
        done
      become: true
      become_user: "{{ bastion_user }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[bastion_user][1] }}"
      changed_when: true
      when: not (is_commercial_pam | bool)

    - name: Restart rsyslog
      ansible.builtin.service:
        name: rsyslog
        state: restarted
      when: bastion_siem_forward_enabled | default(false) | bool

    - name: Restart auditd for SIEM
      ansible.builtin.service:
        name: auditd
        state: restarted
      when: bastion_siem_forward_enabled | default(false) | bool

  tasks:
    - name: "[CSO] Preflight — обязательные проверки платформы и политики"
      ansible.builtin.include_tasks: tasks/preflight_cso.yml

    # --- ВЕТКА А: КЛИЕНТ С КОММЕРЧЕСКИМ PAM ---
    - name: Инициализация интеграции с коммерческим PAM заказчика
      ansible.builtin.include_tasks: tasks/commercial_pam.yml
      when: is_commercial_pam | bool

    # --- ВЕТКА Б: OPEN-SOURCE MT BASTION ---
    - name: Развертывание бесплатного безопасного стека MT Bastion
      when: not (is_commercial_pam | bool)
      block:
        - name: Подготовка ОС и создание бесправного пользователя
          ansible.builtin.include_tasks: tasks/prepare_os.yml

        - name: Ограничение источника на firewalld (опционально)
          ansible.builtin.include_tasks: tasks/configure_source_firewall.yml
          when: bastion_allowed_source_cidrs | default([]) | length > 0

        - name: SIEM syslog forward (опционально)
          ansible.builtin.include_tasks: tasks/configure_rsyslog_siem.yml

        - name: Provisioning операторов (SSH-ключи + TOTP)
          ansible.builtin.include_tasks: tasks/provision_operators.yml

        - name: Запуск ssh_bastion в Rootless Podman
          ansible.builtin.include_tasks: tasks/deploy_ssh_bastion.yml

        - name: WORM archive session logs (опционально)
          ansible.builtin.include_tasks: tasks/archive_session_logs_worm.yml
          tags: [worm_archive]

    - name: "[CSO] Compliance verify (post-deploy)"
      ansible.builtin.include_tasks: tasks/verify_compliance_cso.yml
      tags: [verify_compliance]
      when: not (is_commercial_pam | bool)
