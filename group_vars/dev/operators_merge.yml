---
# Слияние lab + test + JIT + Tier 2 + Tier 3 lab операторов
pam_operators: >-
  {{
    pam_operators_lab
    + (pam_operators_test | default([]))
    + (pam_operators_jit_lab | default([]))
    + (pam_operators_audit_lab | default([]))
    + (pam_operators_break_glass_lab | default([]))
    + (pam_operators_gateway_lab | default([]))
    + (pam_operators_dr_service_lab | default([]))
    + (
        pam_operators_fido_lab | default([])
        if (pam_fido_lab_enabled | default(false) | bool)
        else []
      )
  }}
