---
# Dev-контур: lab-ключи + фиксированный TOTP (без Vault). НЕ для prod.

pam_lab_domain: example.com
lab_keys_dir: "{{ playbook_dir }}/lab/keys"

# TOTP lab (otpauth URI в комментариях):
# engineer-jump: otpauth://totp/SSH%20PAM:engineer-jump@example.com?secret=WRGZUIDE6V4C5YGGDL4JIQJ23RF5JBUA&issuer=SSH+PAM+Lab
# engineer-shell: otpauth://totp/SSH%20PAM:engineer-shell@example.com?secret=4EQHJGRNNM66OR5BEFLYABHOF6S47A3Q&issuer=SSH+PAM+Lab
pam_operators_lab:
  - name: engineer-jump
    email: engineer-jump@example.com
    pubkey: "{{ lookup('file', lab_keys_dir + '/engineer-jump.lab.pub') }}"
    mfa_secret: WRGZUIDE6V4C5YGGDL4JIQJ23RF5JBUA
    access: jump
    permit_open:
      - "10.0.1.10:22"
  - name: engineer-shell
    email: engineer-shell@example.com
    pubkey: "{{ lookup('file', lab_keys_dir + '/engineer-shell.lab.pub') }}"
    mfa_secret: 4EQHJGRNNM66OR5BEFLYABHOF6S47A3Q
    access: shell
    incident_id: INC-LAB-SHELL-01
