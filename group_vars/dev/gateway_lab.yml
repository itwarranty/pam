---
# Tier 3 lab: SSH gateway + mock target container on podman network pam_net.
pam_gateway_lab_enabled: true
pam_dr_enabled: true
pam_gateway_lab_mode: true
pam_require_vault_target_keys: false
pam_shell_command_policy_enabled: true
pam_gateway_command_policy_v2_enabled: true
pam_shell_command_policy_v2_enabled: true
pam_session_search_enabled: true
pam_audit_log_dir_mode: "1777"
pam_runtime_sessions_dir_mode: "1777"
pam_syslog_journal_bridge: true
pam_container_mount_dev_log: true

pam_targets:
  - id: lab-mock-01
    host: gateway-target
    port: 22
    account: pam_support
    identity_file: "{{ lab_keys_dir }}/gateway-target-support.lab"
    tags: [lab]
    description: "Gateway lab mock SSH target (gateway_target container)"

pam_operators_gateway_lab:
  - name: gateway-lab
    email: gateway-lab@example.com
    pubkey: "{{ lookup('file', lab_keys_dir + '/gateway-lab.lab.pub') }}"
    mfa_secret: GATEWAYLABGATEWAYLABGATEWAYLABG
    access: gateway
    incident_id: INC-LAB-GW-01
    permit_open:
      - "gateway-target:22"
    allowed_sources:
      - "127.0.0.0/8"

pam_permitted_targets:
  - "10.0.1.10:22"
  - "10.0.1.11:22"
  - "gateway-target:22"
