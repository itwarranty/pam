---
# Решения CSO — не переопределять без formal risk acceptance заказчика

# Обязательная платформа (плейбук прервётся на других ОС)
bastion_required_os: Rocky
bastion_required_os_major: "9"
bastion_required_arch: x86_64
bastion_selinux_enforcing: true

# Движок — только rootless Podman (Docker не поддерживается)
container_engine: podman

# MFA — только strict-образ (MFA_STRICT=1 при сборке)
bastion_mfa_enforce: true

# Именование и пути
bastion_user: mt_bastion
bastion_ssh_port: 2222
bastion_home: "/home/{{ bastion_user }}"
trusted_files_dir: /tmp/trusted_upstream_packages
audit_log_dir: /var/log/bastion_sessions
operators_home: "{{ bastion_home }}/operators"

# Jump-host: whitelist обязателен (пустой список = запрет деплоя)
bastion_allow_tcp_forwarding: true
bastion_permitted_targets:
  - "10.0.1.10:22"
  - "10.0.1.11:22"

bastion_mfa_secrets_output_dir: "{{ playbook_dir }}/generated/mfa"

# Операторы prod — через Vault; dev — `group_vars/dev/` (lab keys)
bastion_operators: []

# Tier 1 Free (v0.2): source IP, SIEM, WORM archive
bastion_require_source_ip: false
bastion_allowed_source_cidrs: []
bastion_siem_forward_enabled: false
bastion_siem_server: ""
bastion_siem_port: 514
bastion_siem_protocol: tcp
bastion_worm_archive_dir: ""
bastion_worm_archive_min_age_minutes: 5

# Tier 1 Phase B (v0.3): JIT access windows
bastion_jit_timer_enabled: false
bastion_jit_timer_schedule: hourly
bastion_jit_purge_script_path: /usr/local/bin/mt-bastion-jit-purge.sh
bastion_jit_playbook_command: >-
  /usr/bin/ansible-playbook -i /opt/mt-bastion/inventory/hosts.yml
  /opt/mt-bastion/site.yml --tags jit_purge

# Tier 1 Phase C (v0.4): SSH User CA prod policy
bastion_allow_raw_pubkey_prod: false
bastion_cert_max_validity_hours: 72
bastion_ssh_user_ca_qa_complete: false

# Tier 2 Free (v0.5): incident logs, command policy, audit role, rate limit, break-glass
bastion_shell_command_policy_enabled: true
bastion_shell_command_denylist:
  - 'rm\s+-rf\s+/'
  - 'iptables\s+-F'
  - 'mkfs\.'
  - 'dd\s+if='
  - ':(){ :|:& };:'
bastion_ssh_rate_limit_enabled: false
bastion_ssh_rate_limit_method: firewalld
bastion_ssh_rate_limit_rate: "30/m"
bastion_fail2ban_maxretry: 5
bastion_fail2ban_bantime: 3600
bastion_fail2ban_logpath: /var/log/secure
bastion_break_glass_enabled: false
bastion_break_glass_max_hours: 4
bastion_break_glass_audit_enabled: true

# Tier 3 Free (v0.6): SSH gateway — target session recording + credential broking
bastion_targets: []
bastion_targets_home: "{{ bastion_home }}/targets"
bastion_runtime_dir: "{{ bastion_home }}/runtime"
bastion_gateway_lab_mode: false
bastion_gateway_lab_enabled: false
bastion_gateway_lab_network: mt_bastion_net
bastion_gateway_lab_target_image: mt_gateway_target:latest
bastion_require_vault_target_keys: true
bastion_prod_require_gateway: false
bastion_prod_target_tags: [prod]
bastion_jump_risk_acceptance_required: false
bastion_session_ctl_enabled: true
bastion_kill_gateway_sessions: true
bastion_gateway_audit_target_keys: true

# Локальный доверенный образ (Air Gap)
bastion_image_name: mt_bastion_secure
bastion_image_tag: latest
bastion_image_tar: "{{ trusted_files_dir }}/mt_bastion_image.tar"
bastion_required_image_mfa_strict: "1"

# Коммерческий PAM (ветка A)
is_commercial_pam: false
commercial_pam_api_url: ""
commercial_pam_api_token: ""
