---
# Production Air Gap profile — CSO-aligned defaults.
# Usage:
#   ansible-playbook -i inventory/hosts.yml site.yml -e @group_vars/profiles/prod.yml
# Combine with Vault-backed pam_operators / pam_targets.

pam_profile: prod

pam_require_source_ip: true
pam_siem_forward_enabled: true
# Set pam_siem_server in inventory/group_vars
pam_require_fido_pubkey: true
pam_mfa_mode: fido_totp
pam_require_vault_target_keys: true
pam_allow_raw_pubkey_prod: false
pam_gateway_lab_enabled: false
pam_gateway_lab_mode: false
pam_prod_require_gateway: true
pam_command_policy_v2_required: true
pam_session_search_enabled: true
pam_session_watch_enabled: true
pam_audit_log_dir_mode: "0750"
pam_audit_log_file_mode: "0640"
pam_mfa_bootstrap_generate: false
